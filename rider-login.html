<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rider — Ingia | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="back" onclick="window.location.href='index.html'">←</button>
    <div class="brand"><img src="icons/icon-192.png" alt="UJASI" class="logo-mark"> UJASI</div>
  </div>

  <div class="container reveal">
    <div class="badge badge-primary" style="margin-bottom:10px;">PANELI YA RIDER</div>
    <h1 style="font-size:23px;">Karibu, Rider</h1>
    <p class="muted" style="margin-bottom:22px;">Ingia kuona oda zilizo tayari kuchukuliwa.</p>

    <form id="loginForm">
      <div class="field">
        <label>Barua Pepe</label>
        <input type="email" id="loginEmail" placeholder="rider@mfano.com" required>
      </div>
      <div class="field">
        <label>Nenosiri</label>
        <input type="password" id="loginPass" placeholder="••••••••" required>
      </div>
      <div style="text-align:right; margin-bottom:14px;"><a href="#" class="muted" style="font-weight:600; font-size:12.5px;" onclick="forgotPasswordHere(); return false;">Umesahau nenosiri?</a></div>
      <button type="submit" class="btn btn-primary btn-block">Ingia Paneli ya Rider</button>
    </form>

    <div class="hr"></div>
    <p style="text-align:center;" class="muted">
      Bado hujasajiliwa kama Rider?
      <br><a href="rider-register.html" style="font-weight:700;">Sajili Kama Rider →</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPass").value;

  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then((cred) => db.collection("users").doc(cred.user.uid).get()
      .then((doc) => {
        const data = doc.exists ? doc.data() : null;
        if(data && data.role === "rider") return { status: "ok", data };
        if(data) return { status: "wrong-role" };

        // Hakuna hati ya "role" (users/{uid}) - angalia kama hati ya
        // rider (riders/{uid}) ipo. JIREKEBISHE: pengine akaunti ya Auth
        // na hati ya rider ziliundwa vizuri wakati wa usajili, lakini
        // hati ya role pekee ndiyo ilishindwa kuandikwa dakika hiyo.
        return db.collection("riders").doc(cred.user.uid).get().then((rDoc) => {
          if(rDoc.exists && rDoc.data().ownerUid === cred.user.uid){
            const r = rDoc.data();
            const fixed = {
              name: r.name || "", phone: r.phone || "", email: r.email || email,
              role: "rider", riderId: cred.user.uid,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            return db.collection("users").doc(cred.user.uid).set(fixed, { merge: true })
              .then(() => ({ status: "ok", data: fixed }));
          }
          // Hakuna hati ya role WALA hati ya rider - usajili haukukamilika
          // kabisa (mf. mtandao ulikatika mara baada ya akaunti ya Auth
          // kuundwa, kabla hata batch ya Firestore haijafika server).
          // Njia salama pekee ni rider AJISAJILI TENA kwa barua pepe hii
          // hii; ukurasa wa usajili una uwezo wa "kujirekebisha" (self-heal)
          // wa kukamilisha hati zinazokosekana (ona rider-register.html).
          return { status: "orphaned" };
        });
      })
    )
    .then((result) => {
      if(result.status === "ok"){
        showToast("Umeingia — Karibu!", "success");
        setTimeout(() => window.location.href = "rider-dashboard.html", 500);
        return;
      }
      firebase.auth().signOut();
      if(result.status === "orphaned"){
        showToast("Usajili wako haukukamilika kikamilifu wakati ule (tatizo la mtandao). Unaelekezwa kwenye ukurasa wa Sajili kukamilisha - tumia barua pepe na nenosiri hilo hilo.", "error");
        setTimeout(() => {
          window.location.href = "rider-register.html?email=" + encodeURIComponent(email);
        }, 2500);
      } else {
        showToast("Akaunti hii si ya Rider", "error");
      }
    })
    .catch((err) => {
      console.error(err);
      const authErrs = ["auth/wrong-password","auth/user-not-found","auth/invalid-credential","auth/invalid-email"];
      showToast(
        authErrs.includes(err.code)
          ? "Barua pepe au nenosiri si sahihi"
          : ("Hitilafu: " + (err.message || err.code || "haijulikani")),
        "error"
      );
    });
});

function forgotPasswordHere(){
  const email = document.getElementById("loginEmail").value.trim();
  sendPasswordReset(email);
}
</script>
</body>
</html>
