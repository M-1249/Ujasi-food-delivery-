<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sajili Rider — UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <div class="brand"><div class="cross"></div> UJASI</div>
  </div>

  <div class="container reveal">
    <div class="badge badge-primary" style="margin-bottom:10px;">SAJILI KAMA RIDER</div>
    <h1 style="font-size:22px;">Karibu kwenye UJASI</h1>
    <p class="muted" style="margin-bottom:22px;">Jaza taarifa za msingi tu — aina ya chombo na namba ya bango utaziweka baadaye kwenye "Profaili" ukiwa umeshaingia. Baada ya kusajili, akaunti yako itasubiri idhini ya Msimamizi kabla hujaanza kupokea oda.</p>

    <form id="regForm">
      <div class="field">
        <label>Jina Kamili</label>
        <input type="text" id="rName" placeholder="Jina Lako" required>
      </div>
      <div class="field">
        <label>Namba ya Simu</label>
        <input type="tel" id="rPhone" placeholder="0712 345 678" required>
      </div>
      <div class="field">
        <label>Barua Pepe</label>
        <input type="email" id="rEmail" placeholder="rider@mfano.com" required>
      </div>
      <div class="field">
        <label>Nenosiri</label>
        <input type="password" id="rPass" placeholder="Angalau herufi 6" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="regBtn">Sajili Kama Rider</button>
    </form>

    <div class="hr"></div>
    <p style="text-align:center;" class="muted">
      Una akaunti tayari? <a href="rider-login.html" style="font-weight:700;">Ingia</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/riders-firestore.js"></script>
<script src="js/rider.js"></script>
<script>
document.getElementById("regForm").addEventListener("submit", function(e){
  e.preventDefault();

  // Ukifika hapa ukitokea rider-login.html (akaunti "yatima" iliyogundulika
  // wakati wa kuingia), barua pepe imeshajazwa moja kwa moja - angalia
  // window.onload chini.
  const name = document.getElementById("rName").value.trim();
  const phone = document.getElementById("rPhone").value.trim();
  const email = document.getElementById("rEmail").value.trim();
  const pass = document.getElementById("rPass").value;

  if(!name || !phone || !email || !pass){
    showToast("Tafadhali jaza sehemu zote za lazima", "error");
    return;
  }

  const btn = document.getElementById("regBtn");
  btn.disabled = true;
  btn.textContent = "Inaunda akaunti…";

  // Tengeneza hati ya rider NA hati ya users/{uid} (role) kwa ANDIKO
  // MOJA LA "BATCH" (atomiki) - ona maelezo kwenye js/riders-firestore.js
  // (createNewRider). Aina ya Chombo/Namba ya Bango hazipo tena hapa -
  // zina default ("Pikipiki" / tupu) na rider anaweza kuzikamilisha
  // baadaye kwenye rider-profile.html.
  function finishRiderSetup(uid){
    btn.textContent = "Inahifadhi taarifa za rider…";
    return createNewRider({ name, phone }, {
      name, phone, email, role: "rider", riderId: uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  function onSuccess(){
    showToast("Umesajiliwa! Akaunti yako inasubiri idhini ya Msimamizi.", "success");
    setTimeout(() => window.location.href = "rider-dashboard.html", 800);
  }
  function resetBtn(){
    btn.disabled = false;
    btn.textContent = "Sajili Kama Rider";
  }

  // Tengeneza akaunti HALISI ya Firebase Auth KWANZA - UID yake ndiyo
  // itakayotumika moja kwa moja kama riderId (Firestore halisi).
  firebase.auth().createUserWithEmailAndPassword(email, pass)
    .then((cred) => finishRiderSetup(cred.user.uid).catch((err) => {
      // Auth imefanikiwa lakini batch ya Firestore imeshindikana kabisa
      // (mfano: mtandao umekatika kabla commit haijafika server) - RUDISHA
      // NYUMA (futa) akaunti ya Auth mara moja, ili barua pepe hii
      // isibaki "yatima" na mtumiaji aweze kujaribu tena bila kupata
      // "email tayari inatumika" bure.
      return cred.user.delete().catch(() => {}).then(() => { throw err; });
    }))
    .then(onSuccess)
    .catch((err) => {
      if(err && err.code === "auth/email-already-in-use"){
        // Pengine ni akaunti "yatima" iliyobaki kutoka jaribio la
        // zamani KABLA ya rekebisho hili la juu (Auth iliundwa lakini
        // hati ya rider haikuandikwa). Jaribu kuingia na kukamilisha
        // usajili badala ya kumwachia mtumiaji akwame.
        firebase.auth().signInWithEmailAndPassword(email, pass)
          .then((cred) => db.collection("riders").doc(cred.user.uid).get()
            .then((rDoc) => {
              if(rDoc.exists){
                showToast("Barua pepe hii tayari ina akaunti ya Rider. Tafadhali ingia.", "error");
                firebase.auth().signOut();
                resetBtn();
                return;
              }
              return finishRiderSetup(cred.user.uid).then(onSuccess);
            })
          )
          .catch(() => {
            showToast("Barua pepe hii tayari inatumika. Tumia nenosiri lako sahihi, au bonyeza \"Umesahau nenosiri\".", "error");
            resetBtn();
          });
        return;
      }
      console.error(err);
      const map = {
        "auth/weak-password": "Nenosiri ni dhaifu sana (herufi 6+).",
        "auth/invalid-email": "Barua pepe si sahihi."
      };
      showToast(map[err.code] || ("Imeshindikana kusajili: " + (err.message || err.code || "hitilafu isiyojulikana")), "error");
      resetBtn();
    });
});

// Ukifika hapa kutoka rider-login.html (?email=...) kwa sababu akaunti
// yako ya Auth ilikuwa "yatima" (haina hati ya rider), jaza barua pepe
// moja kwa moja ili ujaze tu Jina/Simu/Nenosiri lililetua kutumia awali.
(function prefillEmailFromLogin(){
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email");
  if(email){
    document.getElementById("rEmail").value = email;
    showToast("Kamilisha usajili wako hapa chini kwa barua pepe hii hii", "success");
  }
})();
</script>
</body>
</html>
