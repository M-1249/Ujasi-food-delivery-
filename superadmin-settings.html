<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mipangilio — Super Admin | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<script>
  if(!localStorage.getItem("ujasi_superadmin_session")){
    window.location.replace("superadmin-login.html");
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><div class="cross"></div> Mipangilio ya Jukwaa</div>
  </div>

  <div class="container reveal">
    <div class="field">
      <label>Asilimia ya Tozo ya Jukwaa (%)</label>
      <input type="number" id="pCommission" placeholder="12">
    </div>
    <div class="field">
      <label>Namba ya Msaada kwa Wateja</label>
      <input type="tel" id="pSupportPhone" placeholder="0700 000 000">
    </div>
    <div class="field">
      <label>Masharti ya Huduma (Muhtasari)</label>
      <textarea id="pTerms" rows="5" placeholder="Andika masharti ya jumla ya huduma hapa..."></textarea>
    </div>
    <button class="btn btn-primary btn-block" id="saveBtn">Hifadhi Mipangilio</button>

    <div class="hr"></div>
    <a href="adminlayer1-settings.html" class="btn btn-outline btn-block">💳 Mipangilio ya Lipa Namba (Admin Layer 1) →</a>

    <div class="hr"></div>
    <button class="btn btn-outline btn-block" style="margin-bottom:10px;" data-install-btn onclick="triggerInstall()">📲 Install App (Paneli Hii)</button>
    <a href="superadmin-login.html" class="btn btn-outline btn-block" id="logoutBtn">Toka Super Admin</a>
  </div>
</div>

<div class="bottom-nav">
  <a href="superadmin-dashboard.html"><span class="ic">📊</span>Dashibodi</a>
  <a href="superadmin-approvals.html"><span class="ic">✅</span>Idhini</a>
  <a href="superadmin-promotions.html"><span class="ic">🎁</span>Ofa</a>
  <a href="superadmin-reviews.html"><span class="ic">⭐</span>Reviews</a>
  <a href="superadmin-reports.html"><span class="ic">📈</span>Ripoti</a>
  <a href="superadmin-settings.html" class="active"><span class="ic">⚙️</span>Mipangilio</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/super-admin.js"></script>
<script>
function load(){
  const s = getPlatformSettings();
  document.getElementById("pCommission").value = s.commissionPercent;
  document.getElementById("pSupportPhone").value = s.supportPhone;
  document.getElementById("pTerms").value = s.termsText;
}
document.getElementById("saveBtn").addEventListener("click", function(){
  savePlatformSettings({
    commissionPercent: Number(document.getElementById("pCommission").value) || 0,
    supportPhone: document.getElementById("pSupportPhone").value.trim(),
    termsText: document.getElementById("pTerms").value.trim()
  });
  showToast("Mipangilio ya jukwaa imesasishwa", "success");
});
document.getElementById("logoutBtn").addEventListener("click", function(e){
  e.preventDefault();
  firebase.auth().signOut().finally(() => {
    localStorage.removeItem("ujasi_superadmin_session");
    window.location.href = "superadmin-login.html";
  });
});
load();
</script>
</body>
</html>
