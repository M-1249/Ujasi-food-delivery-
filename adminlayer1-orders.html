<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dispatch — Admin Layer 1 | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
  .filter-scroll{ display:flex; gap:8px; overflow-x:auto; padding:14px 18px; scrollbar-width:none; }
  .filter-scroll::-webkit-scrollbar{ display:none; }
  .order-card{ margin:0 18px 14px; }
  .order-card .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .order-card .items{ font-size:12.5px; color: var(--ink-soft); margin-bottom:8px; }
  .assign-row{ display:flex; gap:8px; margin-top:10px; align-items:center; }
  .assign-row select{ flex:1; padding:9px 10px; border-radius: var(--r-sm); border:1.5px solid var(--line); font-size:12.5px; }
  .mini-map{ margin-top:10px; }
  .mini-map iframe{ width:100%; height:140px; border:0; border-radius: var(--r-md); }
  .detail-link{ font-size:12px; font-weight:700; color:var(--primary); background:none; border:none; cursor:pointer; padding:0; margin-top:8px; }
  .water-action-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

  .modal-bg{
    display:none; position:fixed; inset:0; background:rgba(11,43,38,.45); z-index:80;
    align-items:flex-end; justify-content:center;
  }
  .modal-bg.show{ display:flex; }
  .modal-sheet{
    background:#fff; width:100%; max-width:480px; border-radius: 22px 22px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom)); animation: reveal-up .3s cubic-bezier(.16,.8,.24,1) both;
    max-height:88vh; overflow-y:auto;
  }
  .detail-row{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row .dlabel{ color:var(--ink-soft); }
  .detail-row .dval{ font-weight:600; text-align:right; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt="UJASI" class="logo-mark"> Dispatch — Oda Zote</div>
  </div>

  <div class="filter-scroll reveal" id="filterScroll"></div>

  <div id="ordersList" class="stagger"></div>

</div>

<div class="bottom-nav">
  <a href="adminlayer1-dashboard.html"><span class="ic">📊</span>Dashibodi</a>
  <a href="adminlayer1-orders.html" class="active"><span class="ic">🧾</span>Dispatch</a>
  <a href="adminlayer1-restaurants.html"><span class="ic">🏪</span>Migahawa</a>
  <a href="adminlayer1-riders.html"><span class="ic">🏍️</span>Riders</a>
  <a href="adminlayer1-settings.html"><span class="ic">⚙️</span>Mipangilio</a>
</div>

<!-- Modal ya Taarifa Kamili za Oda (mteja, malipo, ujumbe kwa mteja) -->
<div class="modal-bg" id="detailModal">
  <div class="modal-sheet">
    <h3 style="font-size:16px;">Taarifa Kamili za Oda</h3>
    <input type="hidden" id="detailOrderCode">
    <div id="detailBody"></div>

    <div class="section-title" style="margin-top:16px;"><h2 style="font-size:13px;">Ujumbe kwa Mteja</h2></div>
    <p class="muted" style="margin-top:-4px;">Ujumbe huu utaonekana kwa mteja kwenye ukurasa wa kufuatilia oda.</p>
    <div class="field">
      <textarea id="adminNoteInput" rows="3" placeholder="Mfano: Tumethibitisha malipo yako, oda inaandaliwa"></textarea>
    </div>
    <div class="row gap-12">
      <button class="btn btn-outline btn-block" onclick="closeDetailModal()">Funga</button>
      <button class="btn btn-primary btn-block" onclick="saveAdminNote()">Tuma Ujumbe</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>guardRole("admin_layer1", "adminlayer1-login.html");</script>
<script src="js/riders-firestore.js"></script>
<script src="js/location.js"></script>
<script src="js/orders-firestore.js"></script>
<script src="js/admin-layer1.js"></script>
<script>
const FILTERS = [
  { key: "zote", label: "Zote" },
  { key: "pending_verification", label: "Zinasubiri Malipo" },
  { key: "ready_for_pickup_unassigned", label: "Hazina Rider" },
  { key: "on_the_way", label: "Njiani" },
  { key: "delivered", label: "Zimekamilika" }
];
let activeFilter = "zote";

function statusLabel(s){
  const map = { pending_verification:"Inasubiri Uthibitisho", payment_confirmed:"Malipo Sahihi", preparing:"Inaandaliwa", ready_for_pickup:"Tayari Kuchukuliwa", on_the_way:"Njiani", delivered:"Imefika", cancelled:"Imeghairiwa" };
  return map[s] || s;
}
function statusBadgeClass(s){
  if(s === "delivered") return "badge-success";
  if(s === "cancelled") return "badge-alert";
  if(s === "pending_verification") return "badge-warn";
  return "badge-primary";
}

function renderFilters(){
  document.getElementById("filterScroll").innerHTML = FILTERS.map(f =>
    `<div class="cat-chip ${f.key===activeFilter?'active':''}" onclick="selectFilter('${f.key}')">${f.label}</div>`
  ).join("");
}
function selectFilter(key){
  activeFilter = key;
  renderFilters();
  renderOrders();
}

function filteredOrders(){
  const all = getAllOrdersSorted();
  if(activeFilter === "zote") return all;
  if(activeFilter === "ready_for_pickup_unassigned") return all.filter(o => o.status === "ready_for_pickup" && !o.riderId);
  return all.filter(o => o.status === activeFilter);
}

function renderOrders(){
  const list = filteredOrders();
  const wrap = document.getElementById("ordersList");
  const riders = getAllRiderProfiles();

  if(list.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="ic">🧾</div>Hakuna oda kwenye kundi hili</div>`;
    return;
  }

  wrap.innerHTML = list.map(o => {
    const addr = o.deliveryAddress;
    const mapEmbed = addr && addr.lat ? `<div class="mini-map"><iframe src="${buildEmbedUrl(addr.lat, addr.lng, 14)}" loading="lazy"></iframe></div>` : "";
    const needsRider = o.status === "ready_for_pickup" && !o.riderId;
    const sortedRiders = riders.filter(r => r.approved).sort((a,b) => (b.online?1:0) - (a.online?1:0)); // online juu
    const riderOptions = sortedRiders.map(r => `<option value="${r.id}" ${o.riderId===r.id?'selected':''}>${r.name}${r.online?' 🟢 Yupo Mtandaoni':' ⚪️ Offline'}</option>`).join("");

    return `
      <div class="card order-card">
        <div class="top">
          <span style="font-family:var(--font-mono); font-weight:700; font-size:13.5px;">${o.orderCode}</span>
          <span class="badge ${statusBadgeClass(o.status)}">${statusLabel(o.status)}</span>
        </div>
        <div class="items">${o.items.map(i => `${i.qty}× ${i.name} <span class="muted">(${i.restaurantName})</span>`).join(", ")}</div>
        <div class="row between">
          <span class="muted">${o.customerName || "Mteja"} · ${new Date(o.createdAt).toLocaleString("sw-TZ",{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}</span>
          <span style="font-weight:700; font-family:var(--font-mono);">${formatTZS(o.total)}</span>
        </div>
        ${addr ? `<div class="muted" style="margin-top:4px;">📍 ${addr.details}</div>` : ""}
        ${o.note ? `<div class="muted" style="margin-top:4px;">📝 ${o.note}</div>` : ""}
        ${o.adminNote ? `<div class="muted" style="margin-top:4px; background:var(--primary-tint); padding:6px 8px; border-radius:6px;">💬 Ujumbe: ${o.adminNote}</div>` : ""}
        ${mapEmbed}
        ${paymentButtons(o)}
        ${isWaterOrder(o) ? waterActionButtons(o) : ""}
        <button class="detail-link" onclick="openDetailModal('${o.orderCode}')">📋 Taarifa Kamili za Mteja/Malipo →</button>
        ${(needsRider || o.riderId) ? `
          <div class="assign-row">
            <select id="riderSel-${o.orderCode}">
              <option value="">-- Chagua Rider --</option>
              ${riderOptions}
            </select>
            <button class="btn btn-primary btn-sm" onclick="assignRider('${o.orderCode}')">Gawa</button>
          </div>` : ""}
      </div>
    `;
  }).join("");
}

async function assignRider(code){
  const sel = document.getElementById(`riderSel-${code}`);
  if(!sel.value){ showToast("Chagua rider kwanza", "error"); return; }
  const btn = sel.nextElementSibling;
  sel.disabled = true;
  if(btn){ btn.disabled = true; btn.textContent = "Inagawa..."; }
  try{
    await assignRiderToOrder(code, sel.value);
    showToast("Rider amegawiwa oda hii", "success");
  }catch(err){
    console.error(err);
    showToast("Imeshindikana kugawa - jaribu tena", "error");
  }
  renderOrders(); // onSnapshot itasasisha tena hata hivyo, hii ni haraka zaidi
}

/* ---------- Uthibitisho wa Malipo (Admin TU - kwa oda za chakula NA maji) ----------
   Pesa zote zinaingia Lipa Namba ya jukwaa, kwa hiyo mgahawa HAWEZI kuthibitisha
   malipo. Admin anaandika KIASI HALISI alichoona kwenye SMS/muamala; rules
   zinakataa uthibitisho kama kiasi hakilingani na jumla ya oda (paidAmount == total). */
function paymentButtons(o){
  if(o.status !== "pending_verification") return "";
  return `<div class="water-action-row">
    <div class="muted" style="margin:6px 0 4px;">🔖 Namba ya Muamala: <b style="font-family:var(--font-mono);">${o.txnId || "—"}</b></div>
    <button class="btn btn-primary btn-sm" onclick="confirmPayment('${o.orderCode}')">✔ Thibitisha Malipo</button>
    <button class="btn btn-outline btn-sm" onclick="cancelWaterOrder('${o.orderCode}')">✕ Kataa</button>
  </div>`;
}

// Kinga ya bei: rules haziwezi kupitia orodha ya bidhaa, kwa hiyo tunalinganisha
// jumla ya oda na bei HALISI za menyu (reads chache: bidhaa za oda hii tu).
async function expectedFoodTotal(o){
  if(isWaterOrder(o)) return null;
  const docs = await Promise.all(o.items.map(i =>
    db.collection("restaurants").doc(i.restaurantId || o.restaurantId).collection("menu").doc(i.id).get()
  ));
  let sum = 0;
  for(let k = 0; k < docs.length; k++){
    if(!docs[k].exists) return { missing: true };
    sum += Number(docs[k].data().price) * Number(o.items[k].qty);
  }
  return { sum: sum + Number(o.deliveryFee || 0) };
}

async function confirmPayment(code){
  const o = getOrders().find(x => x.orderCode === code);
  if(!o) return;
  let warn = "";
  try{
    const exp = await expectedFoodTotal(o);
    if(exp && exp.missing){
      warn = "\n\n⚠ Baadhi ya bidhaa hazipo tena kwenye menyu - kagua oda kwa makini.";
    } else if(exp && exp.sum !== Number(o.total)){
      warn = `\n\n⚠ ONYO: bei za menyu zinatoa ${formatTZS(exp.sum)} lakini oda inasema ${formatTZS(o.total)}. Usithibitishe bila kuhakiki.`;
    }
  }catch(e){ console.warn("Hakiki ya bei imeshindikana:", e); }
  const input = prompt(`Oda ${o.orderCode}\nJumla ya oda: ${formatTZS(o.total)}\nNamba ya Muamala: ${o.txnId}\n\nWeka KIASI HALISI ulichopokea kwenye SMS/Lipa Namba (TSh):${warn}`);
  if(input === null) return;
  const amount = Number(String(input).replace(/[^0-9.]/g, ""));
  if(!amount || amount !== Number(o.total)){
    showToast(`Kiasi (${formatTZS(amount || 0)}) hakilingani na jumla ya oda (${formatTZS(o.total)}). Oda haijathibitishwa.`, "error", 6000);
    return;
  }
  try{
    await updateOrder(code, {
      status: "payment_confirmed",
      paidAmount: amount,
      verifiedBy: auth.currentUser.uid,
      paymentConfirmedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast("Malipo yamethibitishwa", "success");
    renderOrders();
  }catch(err){
    console.error(err);
    showToast(explainUjasiError(err), "error");
  }
}

/* ---------- Vitendo maalum kwa Oda za Maji (hakuna Restaurant Admin kwa hizi) ---------- */
function isWaterOrder(o){
  return o.items.some(i => i.restaurantId === "water");
}
function waterActionButtons(o){
  switch(o.status){
    case "pending_verification":
      return ""; // uthibitisho wa malipo uko kwenye paymentButtons(o) - unahitaji kiasi halisi kilichopokelewa
    case "payment_confirmed":
      return `<div class="water-action-row">
        <button class="btn btn-primary btn-sm" onclick="advanceWaterOrder('${o.orderCode}','ready_for_pickup')">📦 Tayari Kusafirishwa</button>
      </div>`;
    default:
      return "";
  }
}
async function advanceWaterOrder(code, status){
  try{
    await updateOrderStatus(code, status);
    showToast("Hali ya oda ya maji imesasishwa", "success");
    renderOrders();
  }catch(err){
    console.error(err);
    showToast("Imeshindikana kusasisha - jaribu tena", "error");
  }
}
async function cancelWaterOrder(code){
  if(!confirm("Una uhakika unataka kukataa/kughairi oda hii?")) return;
  try{
    await updateOrderStatus(code, "cancelled");
    showToast("Oda imeghairiwa", "success");
    renderOrders();
  }catch(err){
    console.error(err);
    showToast("Imeshindikana kughairi - jaribu tena", "error");
  }
}

/* ---------- Modal ya Taarifa Kamili + Ujumbe kwa Mteja ---------- */
const netMap = { vodacom:"M-Pesa (Vodacom)", tigo:"Mixx by Yas (Tigo)", airtel:"Airtel Money", halotel:"HaloPesa", ttcl:"T-Pesa (TTCL)" };

function openDetailModal(code){
  const order = getOrders().find(o => o.orderCode === code);
  if(!order) return;
  document.getElementById("detailOrderCode").value = code;

  const addr = order.deliveryAddress;
  document.getElementById("detailBody").innerHTML = `
    <div class="detail-row"><span class="dlabel">Jina la Mteja</span><span class="dval">${order.customerName || "Mgeni"}</span></div>
    <div class="detail-row"><span class="dlabel">Namba ya Simu</span><span class="dval">${addr ? addr.phone : "—"}</span></div>
    <div class="detail-row"><span class="dlabel">Mtandao wa Malipo</span><span class="dval">${netMap[order.network] || order.network || "—"}</span></div>
    <div class="detail-row"><span class="dlabel">Namba ya Muamala</span><span class="dval">${order.txnId || "—"}</span></div>
    <div class="detail-row"><span class="dlabel">Kiasi Kilicholipwa</span><span class="dval">${formatTZS(order.total)}</span></div>
    <div class="detail-row"><span class="dlabel">Anwani</span><span class="dval">${addr ? addr.details : "—"}</span></div>
    <div class="detail-row"><span class="dlabel">Rider Aliyegawiwa</span><span class="dval">${order.riderId || "Bado hakuna"}</span></div>
    <div class="detail-row"><span class="dlabel">Hali ya Sasa</span><span class="dval">${statusLabel(order.status)}</span></div>
  `;
  document.getElementById("adminNoteInput").value = order.adminNote || "";
  document.getElementById("detailModal").classList.add("show");
}
function closeDetailModal(){
  document.getElementById("detailModal").classList.remove("show");
}
async function saveAdminNote(){
  const code = document.getElementById("detailOrderCode").value;
  const note = document.getElementById("adminNoteInput").value.trim();
  try{
    await updateOrder(code, { adminNote: note, adminNoteAt: new Date().toISOString() });
    showToast("Ujumbe umetumwa kwa mteja", "success");
    closeDetailModal();
    renderOrders();
  }catch(err){
    console.error(err);
    showToast("Imeshindikana kutuma ujumbe - jaribu tena", "error");
  }
}

window.onUjasiOrdersUpdate = renderOrders; // sasisho la LIVE (Firestore onSnapshot) - hii ndiyo
// inayohakikisha Admin Layer 1 anaona oda mpya (ikiwemo za MAJI) papo
// hapo mteja anapoagiza, bila kubofya reload - kwenye kifaa CHOCHOTE.
window.onUjasiRidersUpdate = renderOrders; // orodha ya "riders" kwenye modal ya kugawa oda isasike
renderFilters();
renderOrders();
</script>
</body>
</html>
