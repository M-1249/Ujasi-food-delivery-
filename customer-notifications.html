<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arifa — UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
  .notif-item{ display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .notif-item .ic{ width:38px; height:38px; border-radius:50%; background:var(--primary-tint); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .notif-item .ntitle{ font-weight:700; font-size:13.5px; }
  .notif-item .ntime{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <h2 style="font-size:16px; margin:0;">Arifa</h2>
  </div>

  <div id="notifList" class="stagger"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/orders-firestore.js"></script>
<script>
function timeAgoLabel(dateStr){
  const diffMin = Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
  if(diffMin < 1) return "Sasa hivi";
  if(diffMin < 60) return `Dakika ${diffMin} zilizopita`;
  const diffHr = Math.floor(diffMin / 60);
  if(diffHr < 24) return `Saa ${diffHr} zilizopita`;
  return new Date(dateStr).toLocaleDateString("sw-TZ");
}

function buildNotifications(orders){
  const notifs = [];
  orders.forEach(o => {
    notifs.push({
      icon: "🧾",
      title: `Oda ${o.orderCode} — ${o.status === "pending_verification" ? "Inasubiri uthibitisho wa malipo" : "Imesasishwa: " + statusLabel(o.status)}`,
      time: o.updatedAt || o.createdAt
    });
    if(o.adminNote){
      notifs.push({
        icon: "💬",
        title: `Ujumbe kuhusu Oda ${o.orderCode}: ${o.adminNote}`,
        time: o.adminNoteAt || o.updatedAt || o.createdAt
      });
    }
  });
  return notifs.sort((a,b) => new Date(b.time) - new Date(a.time));
}
function statusLabel(s){
  const map = { pending_verification:"Inasubiri Uthibitisho", payment_confirmed:"Malipo Sahihi", preparing:"Inaandaliwa", ready_for_pickup:"Tayari Kuchukuliwa", on_the_way:"Njiani", delivered:"Imefika", cancelled:"Imeghairiwa" };
  return map[s] || s;
}

function render(orders){
  const notifs = buildNotifications(orders);
  const wrap = document.getElementById("notifList");
  if(notifs.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="ic">🔔</div>Huna arifa kwa sasa</div>`;
    return;
  }
  wrap.innerHTML = notifs.map(n => `
    <div class="notif-item">
      <div class="ic">${n.icon}</div>
      <div>
        <div class="ntitle">${n.title}</div>
        <div class="ntime">${timeAgoLabel(n.time)}</div>
      </div>
    </div>
  `).join("");
}
render([]); // hali ya awali wakati inapakia
listenMyOrders(render); // MUHIMU: oda ZAKE tu (customerUid == mimi) - si za wateja wengine
</script>
</body>
</html>
