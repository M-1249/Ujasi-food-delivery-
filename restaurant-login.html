<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mgahawa — Ingia | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="back" onclick="window.location.href='index.html'">←</button>
    <div class="brand"><div class="cross"></div> UJASI</div>
  </div>

  <div class="container reveal">
    <div class="badge badge-primary" style="margin-bottom:10px;">PANELI YA MGAHAWA</div>
    <h1 style="font-size:23px;">Karibu, Mwenye Mgahawa</h1>
    <p class="muted" style="margin-bottom:22px;">Ingia kusimamia menyu, oda, na mauzo yako.</p>

    <form id="loginForm">
      <div class="field">
        <label>Barua Pepe ya Mgahawa</label>
        <input type="email" id="loginEmail" placeholder="mgahawa@mfano.com" required>
      </div>
      <div class="field">
        <label>Nenosiri</label>
        <input type="password" id="loginPass" placeholder="••••••••" required>
      </div>
      <div style="text-align:right; margin-bottom:14px;"><a href="#" class="muted" style="font-weight:600; font-size:12.5px;" onclick="forgotPasswordHere(); return false;">Umesahau nenosiri?</a></div>
      <button type="submit" class="btn btn-primary btn-block">Ingia Paneli ya Mgahawa</button>
    </form>

    <div class="hr"></div>
    <p style="text-align:center;" class="muted">
      Mgahawa wako haupo kwenye jukwaa bado?
      <br><a href="restaurant-register.html" style="font-weight:700;">Sajili Mgahawa Mpya →</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPass").value;

  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then((cred) => db.collection("users").doc(cred.user.uid).get())
    .then((doc) => {
      const data = doc.exists ? doc.data() : null;
      if(!data || data.role !== "restaurant_admin"){
        showToast("Akaunti hii si ya Msimamizi wa Mgahawa", "error");
        firebase.auth().signOut();
        return;
      }
      localStorage.setItem("ujasi_restaurant_session", data.restaurantId || "r1");
      showToast("Umeingia — Karibu!", "success");
      setTimeout(() => window.location.href = "restaurant-dashboard.html", 500);
    })
    .catch((err) => {
      console.error(err);
      showToast("Barua pepe au nenosiri si sahihi", "error");
    });
});

function forgotPasswordHere(){
  const email = document.getElementById("loginEmail").value.trim();
  sendPasswordReset(email);
}
</script>
</body>
</html>
