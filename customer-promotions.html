<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ofa Maalum — UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
  .promo-card{ margin:0 18px 16px; overflow:hidden; padding:0; }
  .promo-cover{ height:140px; background:var(--surface); }
  .promo-cover img{ width:100%; height:100%; object-fit:cover; }
  .promo-body{ padding:16px; }
  .promo-code-chip{
    font-family: var(--font-mono); font-weight:700; font-size:14px;
    background: var(--primary-tint); color: var(--primary-dark);
    border: 1px dashed var(--primary); border-radius: var(--r-pill);
    padding:8px 16px; display:inline-flex; align-items:center; gap:8px; margin-top:10px;
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <h2 style="font-size:16px; margin:0;">🎁 Ofa Maalum</h2>
  </div>

  <div id="promoList" class="stagger" style="padding-top:14px;"></div>
</div>

<script src="js/app.js"></script>
<script src="js/super-admin.js"></script>
<script>
function copyCode(code){
  if(navigator.clipboard){
    navigator.clipboard.writeText(code).then(() => showToast("Msimbo umenakiliwa: " + code, "success"));
  } else {
    showToast("Msimbo: " + code);
  }
}
function render(){
  const list = getActivePromotions();
  const wrap = document.getElementById("promoList");
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="ic">🎁</div>Hakuna ofa kwa sasa — rudi tena baadaye!</div>`;
    return;
  }
  wrap.innerHTML = list.map(p => `
    <div class="card promo-card">
      ${p.image ? `<div class="promo-cover"><img src="${p.image}" alt="${p.title}"></div>` : ""}
      <div class="promo-body">
        <div style="font-weight:700; font-size:15.5px;">${p.title}</div>
        <p class="muted" style="margin-top:4px;">${p.description || ""}</p>
        ${p.code ? `<div class="promo-code-chip" onclick="copyCode('${p.code}')">🎫 ${p.code} <span style="font-size:11px;">📋 Nakili</span></div>` : ""}
        ${p.endDate ? `<div class="muted" style="margin-top:8px; font-size:11px;">Ofa inaisha: ${p.endDate}</div>` : ""}
      </div>
    </div>
  `).join("");
}
render();
</script>
</body>
</html>
