<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sajili Mgahawa — UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <div class="brand"><div class="cross"></div> UJASI</div>
  </div>

  <div class="container reveal">
    <div class="badge badge-primary" style="margin-bottom:10px;">SAJILI MGAHAWA MPYA</div>
    <h1 style="font-size:22px;">Karibu kwenye UJASI</h1>
    <p class="muted" style="margin-bottom:22px;">Jaza taarifa za mgahawa wako ili uanze kupokea oda.</p>

    <form id="regForm">
      <div class="section-title" style="margin-top:0;"><h2 style="font-size:14px;">Taarifa za Mgahawa</h2></div>
      <div class="field">
        <label>Jina la Mgahawa</label>
        <input type="text" id="rName" placeholder="Mfano: Baraka Kitchen" required>
      </div>
      <div class="field">
        <label>Aina ya Chakula</label>
        <select id="rCategory">
          <option>Kienyeji</option><option>Kuku</option><option>Nyama Choma</option>
          <option>Samaki</option><option>Vitafunwa</option><option>Vinywaji</option>
        </select>
      </div>
      <div class="field">
        <label>Kiungo cha Picha ya Jalada (URL) — hiari</label>
        <input type="text" id="rCover" placeholder="https://...">
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Ada ya Usafirishaji (TSh)</label>
          <input type="number" id="rFee" placeholder="2000" value="2000">
        </div>
        <div class="field">
          <label>Muda wa Kuandaa</label>
          <input type="text" id="rPrepTime" placeholder="20-30 dk" value="20-30 dk">
        </div>
      </div>

      <div class="section-title"><h2 style="font-size:14px;">Taarifa za Mmiliki</h2></div>
      <div class="field">
        <label>Jina Lako Kamili</label>
        <input type="text" id="ownerName" placeholder="Jina Kamili" required>
      </div>
      <div class="field">
        <label>Namba ya Simu</label>
        <input type="tel" id="ownerPhone" placeholder="0712 345 678" required>
      </div>
      <div class="field">
        <label>Barua Pepe</label>
        <input type="email" id="ownerEmail" placeholder="mgahawa@mfano.com" required>
      </div>
      <div class="field">
        <label>Nenosiri</label>
        <input type="password" id="ownerPass" placeholder="Angalau herufi 6" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="regBtn">Sajili Mgahawa Wangu</button>
    </form>

    <div class="hr"></div>
    <p style="text-align:center;" class="muted">
      Una akaunti tayari? <a href="restaurant-login.html" style="font-weight:700;">Ingia</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script src="js/restaurant-admin.js"></script>
<script>
document.getElementById("regForm").addEventListener("submit", function(e){
  e.preventDefault();

  const restaurantData = {
    name: document.getElementById("rName").value.trim(),
    category: document.getElementById("rCategory").value,
    cover: document.getElementById("rCover").value.trim(),
    deliveryFee: Number(document.getElementById("rFee").value) || 2000,
    prepTime: document.getElementById("rPrepTime").value.trim() || "20-30 dk",
    phone: document.getElementById("ownerPhone").value.trim(),
    email: document.getElementById("ownerEmail").value.trim()
  };
  const ownerName = document.getElementById("ownerName").value.trim();
  const email = document.getElementById("ownerEmail").value.trim();
  const pass = document.getElementById("ownerPass").value;

  if(!restaurantData.name || !ownerName || !restaurantData.phone || !email || !pass){
    showToast("Tafadhali jaza sehemu zote za lazima", "error");
    return;
  }

  const btn = document.getElementById("regBtn");
  btn.disabled = true;
  btn.textContent = "Inasajili...";

  // 1) Tengeneza mgahawa mpya (localStorage - demo).
  //    Baadaye hii itakuwa doc mpya kwenye Firestore "restaurants/{id}".
  const newRestaurant = createNewRestaurant(restaurantData);

  // 2) Tengeneza akaunti ya Firebase Auth kwa mmiliki, ikiwa Firebase
  //    imeunganishwa (funguo halisi zimewekwa). Ikiwa haipo, tunaendelea
  //    kwa hali ya demo tu (session ya localStorage).
  const proceedDemo = () => {
    localStorage.setItem("ujasi_restaurant_session", newRestaurant.id);
    showToast("Mgahawa umesajiliwa — Karibu!", "success");
    setTimeout(() => window.location.href = "restaurant-dashboard.html", 700);
  };

  if(typeof firebase !== "undefined" && firebase.apps && firebase.apps.length){
    firebase.auth().createUserWithEmailAndPassword(email, pass)
      .then((cred) => db.collection("users").doc(cred.user.uid).set({
        name: ownerName, phone: restaurantData.phone, email: email,
        role: "restaurant_admin", restaurantId: newRestaurant.id,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }))
      .then(proceedDemo)
      .catch((err) => {
        console.error(err);
        // Firebase haijawekewa funguo halisi bado (au email ipo tayari) -
        // endelea kwa hali ya demo ili James aweze kuendelea kujaribu paneli.
        proceedDemo();
      });
  } else {
    proceedDemo();
  }
});
</script>
</body>
</html>
