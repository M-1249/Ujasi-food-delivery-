<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sajili Mgahawa — UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <div class="brand"><div class="cross"></div> UJASI</div>
  </div>

  <div class="container reveal">
    <div class="badge badge-primary" style="margin-bottom:10px;">SAJILI MGAHAWA MPYA</div>
    <h1 style="font-size:22px;">Karibu kwenye UJASI</h1>
    <p class="muted" style="margin-bottom:22px;">Jaza taarifa za msingi tu — vitu kama aina ya chakula, picha ya jalada, ada ya usafirishaji na muda wa kuandaa utaviweka baadaye kwenye "Profaili" ukiwa umeshaingia.</p>

    <form id="regForm">
      <div class="section-title" style="margin-top:0;"><h2 style="font-size:14px;">Taarifa za Mgahawa</h2></div>
      <div class="field">
        <label>Jina la Mgahawa</label>
        <input type="text" id="rName" placeholder="Mfano: Baraka Kitchen" required>
      </div>

      <div class="section-title"><h2 style="font-size:14px;">Taarifa za Mmiliki</h2></div>
      <div class="field">
        <label>Jina Lako Kamili</label>
        <input type="text" id="ownerName" placeholder="Jina Kamili" required>
      </div>
      <div class="field">
        <label>Namba ya Simu</label>
        <input type="tel" id="ownerPhone" placeholder="0712 345 678" required>
      </div>
      <div class="field">
        <label>Barua Pepe</label>
        <input type="email" id="ownerEmail" placeholder="mgahawa@mfano.com" required>
      </div>
      <div class="field">
        <label>Nenosiri</label>
        <input type="password" id="ownerPass" placeholder="Angalau herufi 6" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="regBtn">Sajili Mgahawa Wangu</button>
    </form>

    <div class="hr"></div>
    <p style="text-align:center;" class="muted">
      Una akaunti tayari? <a href="restaurant-login.html" style="font-weight:700;">Ingia</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/restaurants-firestore.js"></script>
<script src="js/restaurant-admin.js"></script>
<script>
document.getElementById("regForm").addEventListener("submit", function(e){
  e.preventDefault();

  // Ukifika hapa ukitokea restaurant-login.html (akaunti "yatima"
  // iliyogundulika wakati wa kuingia), barua pepe imeshajazwa moja kwa
  // moja - angalia prefillEmailFromLogin() chini.

  // Taarifa za "hiari" (category, cover, deliveryFee, prepTime) HAZIPO
  // tena kwenye fomu hii - zina default kwenye js/restaurants-firestore.js
  // (createNewRestaurant) na mmiliki anaweza kuzikamilisha baadaye
  // kwenye restaurant-profile.html.
  const restaurantData = {
    name: document.getElementById("rName").value.trim(),
    phone: document.getElementById("ownerPhone").value.trim(),
    email: document.getElementById("ownerEmail").value.trim()
  };
  const ownerName = document.getElementById("ownerName").value.trim();
  const email = document.getElementById("ownerEmail").value.trim();
  const pass = document.getElementById("ownerPass").value;

  if(!restaurantData.name || !ownerName || !restaurantData.phone || !email || !pass){
    showToast("Tafadhali jaza sehemu zote za lazima", "error");
    return;
  }

  const btn = document.getElementById("regBtn");
  btn.disabled = true;
  btn.textContent = "Inaunda akaunti…";

  function userDocFor(uid){
    return {
      name: ownerName, phone: restaurantData.phone, email: email,
      role: "restaurant_admin", restaurantId: uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
  }

  // Tengeneza hati ya mgahawa NA hati ya users/{uid} (role) kwa
  // ANDIKO MOJA LA "BATCH" (atomiki) - ona maelezo kwenye
  // js/restaurants-firestore.js (createNewRestaurant). Hii inapunguza
  // "round-trip" moja ya mtandao ukilinganisha na maandishi mawili
  // mfululizo ya zamani, na haiwezi kuacha "akaunti yatima".
  function finishRestaurantSetup(uid){
    btn.textContent = "Inahifadhi taarifa za mgahawa…";
    return createNewRestaurant(restaurantData, userDocFor(uid));
  }

  function onSuccess(){
    showToast("Mgahawa umesajiliwa — Karibu!", "success");
    setTimeout(() => window.location.href = "restaurant-dashboard.html", 700);
  }
  function resetBtn(){
    btn.disabled = false;
    btn.textContent = "Sajili Mgahawa Wangu";
  }

  // 1) Tengeneza akaunti HALISI ya Firebase Auth kwa mmiliki KWANZA -
  //    UID yake ndiyo itakayotumika moja kwa moja kama restaurantId
  //    (rahisisha Security Rules + inahakikisha "restaurantId" haiwezi
  //    kugongana na mgahawa mwingine).
  firebase.auth().createUserWithEmailAndPassword(email, pass)
    .then((cred) => finishRestaurantSetup(cred.user.uid).catch((err) => {
      // Auth imefanikiwa lakini batch ya Firestore imeshindikana kabisa
      // (mfano: mtandao umekatika kabla commit haijafika server) - RUDISHA
      // NYUMA (futa) akaunti ya Auth mara moja, ili barua pepe hii
      // isibaki "yatima" na mmiliki aweze kujaribu tena bila kupata
      // "email tayari inatumika" bure. (Batch ni atomiki upande wa
      // Firestore - haiwezi kuacha hati MOJA tu kati ya mbili; hatari
      // pekee iliyobaki ni kuwa Auth ifaulu na batch nzima ishindwe.)
      return cred.user.delete().catch(() => {}).then(() => { throw err; });
    }))
    .then(onSuccess)
    .catch((err) => {
      if(err && err.code === "auth/email-already-in-use"){
        // Pengine ni akaunti "yatima" iliyobaki kutoka jaribio la
        // zamani (Auth iliundwa lakini hati ya mgahawa haikuandikwa).
        // Jaribu kuingia na kukamilisha usajili badala ya kumwachia
        // mmiliki akwame.
        firebase.auth().signInWithEmailAndPassword(email, pass)
          .then((cred) => db.collection("restaurants").doc(cred.user.uid).get()
            .then((rDoc) => {
              if(rDoc.exists){
                showToast("Barua pepe hii tayari ina akaunti ya Mgahawa. Tafadhali ingia.", "error");
                firebase.auth().signOut();
                resetBtn();
                return;
              }
              return finishRestaurantSetup(cred.user.uid).then(onSuccess);
            })
          )
          .catch(() => {
            showToast("Barua pepe hii tayari inatumika. Tumia nenosiri lako sahihi, au bonyeza \"Umesahau nenosiri\".", "error");
            resetBtn();
          });
        return;
      }
      console.error(err);
      const map = {
        "auth/weak-password": "Nenosiri ni dhaifu sana (herufi 6+).",
        "auth/invalid-email": "Barua pepe si sahihi."
      };
      showToast(map[err.code] || ("Imeshindikana kusajili: " + (err.message || err.code || "hitilafu isiyojulikana")), "error");
      resetBtn();
    });
});

// Ukifika hapa kutoka restaurant-login.html (?email=...) kwa sababu
// akaunti yako ya Auth ilikuwa "yatima" (haina hati ya mgahawa), jaza
// barua pepe moja kwa moja ili ujaze tu Jina la Mgahawa/Mmiliki/Simu/
// Nenosiri lililetua kutumia awali.
(function prefillEmailFromLogin(){
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email");
  if(email){
    document.getElementById("ownerEmail").value = email;
    showToast("Kamilisha usajili wako hapa chini kwa barua pepe hii hii", "success");
  }
})();
</script>
</body>
</html>
