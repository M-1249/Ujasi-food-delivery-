<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Migahawa — Admin Layer 1 | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<script>
  if(!localStorage.getItem("ujasi_admin1_session")){
    window.location.replace("login.html");
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css">
<style>
  .rest-row{ display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); align-items:center; }
  .rest-row .rlogo{ width:44px; height:44px; border-radius:50%; background:var(--primary-tint); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; flex:none; }
  .rest-row .rname{ font-weight:700; font-size:14px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><div class="cross"></div> Migahawa Yote</div>
  </div>

  <div class="container" style="padding-bottom:6px;">
    <p class="muted">Migahawa iliyosajiliwa kwenye jukwaa (imesomwa kutoka profaili walizoweka kwenye Restaurant Admin Panel).</p>
  </div>

  <div id="restList" class="stagger"></div>

</div>

<div class="bottom-nav">
  <a href="dashboard.html"><span class="ic">📊</span>Dashibodi</a>
  <a href="orders.html"><span class="ic">🧾</span>Dispatch</a>
  <a href="restaurants.html" class="active"><span class="ic">🏪</span>Migahawa</a>
  <a href="riders.html"><span class="ic">🏍️</span>Riders</a>
  <a href="settings.html"><span class="ic">⚙️</span>Mipangilio</a>
</div>

<script src="../js/app.js"></script>
<script src="../js/admin-layer1.js"></script>
<script>
function render(){
  const list = getAllRestaurantProfiles();
  const wrap = document.getElementById("restList");
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="ic">🏪</div>Bado hakuna mgahawa uliosajiliwa</div>`;
    return;
  }
  wrap.innerHTML = list.map(r => `
    <div class="rest-row">
      <div class="rlogo">${(r.logo || r.name || "M").slice(0,2).toUpperCase()}</div>
      <div style="flex:1;">
        <div class="rname">${r.name}</div>
        <div class="muted">${r.category} · Ada: ${formatTZS(r.deliveryFee)}</div>
      </div>
      <span class="badge ${r.isOpen ? 'badge-success' : 'badge-alert'}">${r.isOpen ? 'Wazi' : 'Imefungwa'}</span>
    </div>
  `).join("");
}
render();
</script>
</body>
</html>
