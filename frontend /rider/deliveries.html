<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oda — Rider | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<script>
  if(!localStorage.getItem("ujasi_rider_session")){
    window.location.replace("login.html");
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css">
<style>
  .tab-row{ display:flex; gap:8px; padding:14px 18px; }
  .tab-btn{ flex:1; text-align:center; padding:10px; border-radius: var(--r-pill); border:1.5px solid var(--line); font-size:13px; font-weight:700; color: var(--ink-soft); background:#fff; cursor:pointer; }
  .tab-btn.active{ background: var(--primary); border-color: var(--primary); color:#fff; }
  .del-card{ margin:0 18px 14px; }
  .del-card .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .del-card .items{ font-size:12.5px; color: var(--ink-soft); margin-bottom:8px; }
  .del-card .addr-line{ font-size:12.5px; color: var(--ink-soft); margin-bottom:4px; }
  .action-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><div class="cross"></div> Oda za Rider</div>
  </div>

  <div class="tab-row reveal" id="tabRow"></div>

  <div id="delList" class="stagger"></div>

</div>

<div class="bottom-nav">
  <a href="dashboard.html"><span class="ic">📊</span>Dashibodi</a>
  <a href="deliveries.html" class="active"><span class="ic">📦</span>Oda</a>
  <a href="profile.html"><span class="ic">🏍️</span>Profaili</a>
</div>

<script src="../js/app.js"></script>
<script src="../js/rider.js"></script>
<script>
const TABS = [
  { key: "available", label: "Zinapatikana" },
  { key: "active", label: "Njiani" },
  { key: "completed", label: "Zimekamilika" }
];
let activeTab = "available";

function statusLabel(s){
  const map = { ready_for_pickup:"Tayari Kuchukuliwa", on_the_way:"Njiani", delivered:"Imefika" };
  return map[s] || s;
}

function renderTabs(){
  document.getElementById("tabRow").innerHTML = TABS.map(t =>
    `<div class="tab-btn ${t.key===activeTab?'active':''}" onclick="selectTab('${t.key}')">${t.label}</div>`
  ).join("");
}
function selectTab(key){
  activeTab = key;
  renderTabs();
  renderList();
}

function addressBlock(o){
  if(!o.deliveryAddress) return `<div class="addr-line">📍 Anwani haijawekwa</div>`;
  const a = o.deliveryAddress;
  const mapLink = a.lat ? `https://www.google.com/maps?q=${a.lat},${a.lng}` : null;
  return `<div class="addr-line">📍 ${a.details} ${mapLink ? `· <a href="${mapLink}" target="_blank" style="font-weight:700;">Ramani →</a>` : ""}</div>
          <div class="addr-line">📞 ${a.phone || "—"} · Mpokeaji: ${o.customerName || "Mteja"}</div>`;
}

function renderList(){
  let list = [];
  if(activeTab === "available") list = getAvailableDeliveries();
  if(activeTab === "active") list = getMyActiveDeliveries();
  if(activeTab === "completed") list = getMyCompletedDeliveries();

  list = list.slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  const wrap = document.getElementById("delList");
  if(list.length === 0){
    const emptyMsg = activeTab === "available" ? "Hakuna oda zinazopatikana kwa sasa"
      : activeTab === "active" ? "Huna oda njiani kwa sasa" : "Bado hujakamilisha oda yoyote";
    wrap.innerHTML = `<div class="empty"><div class="ic">📦</div>${emptyMsg}</div>`;
    return;
  }

  wrap.innerHTML = list.map(o => `
    <div class="card del-card">
      <div class="top">
        <span style="font-family:var(--font-mono); font-weight:700; font-size:13.5px;">${o.orderCode}</span>
        <span class="badge badge-primary">${statusLabel(o.status)}</span>
      </div>
      <div class="items">${o.items.map(i => `${i.qty}× ${i.name}`).join(", ")}</div>
      ${addressBlock(o)}
      <div class="row between" style="margin-top:8px;">
        <span class="muted">Ada ya Usafirishaji</span>
        <span style="font-weight:700; font-family:var(--font-mono);">${formatTZS(o.deliveryFee || 0)}</span>
      </div>
      <div class="action-row">
        ${activeTab === "available" ? `<button class="btn btn-primary btn-sm" onclick="accept('${o.orderCode}')">🏍️ Kubali Oda</button>` : ""}
        ${activeTab === "active" ? `<button class="btn btn-primary btn-sm" onclick="complete('${o.orderCode}')">✔ Imefika kwa Mteja</button>` : ""}
        ${activeTab === "completed" ? `<span class="badge badge-success">Imekamilika</span>` : ""}
      </div>
    </div>
  `).join("");
}

function accept(code){
  acceptDelivery(code);
  showToast("Oda imekubaliwa — safari salama!", "success");
  activeTab = "active";
  renderTabs();
  renderList();
}
function complete(code){
  if(!confirm("Thibitisha: chakula kimefika kwa mteja?")) return;
  completeDelivery(code);
  showToast("Oda imekamilika — asante!", "success");
  renderList();
}

renderTabs();
renderList();
</script>
</body>
</html>
