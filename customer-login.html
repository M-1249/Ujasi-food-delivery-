<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ingia — UJASI Food Delivery</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <div class="brand"><div class="cross"></div> UJASI</div>
  </div>

  <div class="container reveal">
    <h1 style="font-size:24px; margin-top:8px;">Karibu tena</h1>
    <p class="muted" style="margin-bottom:22px;">Ingia kuendelea kuagiza chakula chako.</p>

    <div class="label-card" style="margin-bottom:22px;">
      <div class="label-eyebrow"><span class="dot"></span> Akaunti Salama</div>
      <p style="font-size:12.5px; color:var(--ink-soft); margin:0;">Taarifa zako zinalindwa kwa Firebase Authentication.</p>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>Namba ya Simu au Barua Pepe</label>
        <input type="text" id="loginId" placeholder="0712 345 678" required>
      </div>
      <div class="field">
        <label>Nenosiri</label>
        <input type="password" id="loginPass" placeholder="••••••••" required>
      </div>
      <div class="row between" style="margin-bottom:18px;">
        <label class="muted" style="display:flex; align-items:center; gap:6px; text-transform:none; font-weight:500;">
          <input type="checkbox" style="width:auto;"> Nikumbuke
        </label>
        <a href="#" class="muted" style="font-weight:600;" onclick="forgotPasswordCustomer(); return false;">Umesahau nenosiri?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingia</button>
    </form>

    <div class="hr"></div>
    <p style="text-align:center;" class="muted">
      Huna akaunti? <a href="customer-register.html" style="font-weight:700;">Jisajili sasa</a>
    </p>

    <div class="hr"></div>
    <p style="text-align:center;" class="muted">
      Wewe ni Mgahawa au Rider?
      <br><a href="restaurant-login.html" style="font-weight:700;">Ingia kama Mgahawa</a> ·
      <a href="rider-login.html" style="font-weight:700;">Ingia kama Rider</a>
    </p>
  </div>

</div>

<!-- Firebase (compat SDK - haitumii ES Modules, salama kwa file://) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const id = document.getElementById("loginId").value.trim();
  const pass = document.getElementById("loginPass").value;

  if(!id || !pass){
    showToast("Tafadhali jaza namba/barua pepe na nenosiri", "error");
    return;
  }

  // Ikiwa mtumiaji ameweka namba ya simu, tunaibadilisha kuwa email ya ndani
  // kwa sababu Firebase Auth (Email/Password) inahitaji email.
  // Mfano: 0712345678 -> 0712345678@ujasi.app
  const email = id.includes("@") ? id : `${id.replace(/\s+/g,"")}@ujasi.app`;

  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then((cred) => db.collection("users").doc(cred.user.uid).get().then(doc => ({ cred, doc })))
    .then(({ cred, doc }) => {
      const data = doc.exists ? doc.data() : null;
      if(data && data.role && data.role !== "customer"){
        showToast("Akaunti hii ni ya " + roleLabel(data.role) + " — tumia mlango sahihi wa kuingia", "error");
        firebase.auth().signOut();
        return;
      }
      showToast("Umeingia — Karibu!", "success");
      setTimeout(() => window.location.href = "customer-home.html", 600);
    })
    .catch((err) => {
      console.error(err);
      showToast(mapAuthError(err.code), "error");
    });
});

function roleLabel(role){
  const map = { restaurant_admin: "Mgahawa", rider: "Rider", admin_layer1: "Admin Layer 1", super_admin: "Super Admin" };
  return map[role] || role;
}

function forgotPasswordCustomer(){
  const id = document.getElementById("loginId").value.trim();
  if(!id){
    showToast("Weka barua pepe yako kwenye sehemu ya juu, kisha bofya hapa tena", "error");
    return;
  }
  if(!id.includes("@")){
    showToast("Kwa namba ya simu, hatuwezi kutuma link ya barua pepe. Kama ulisajili na barua pepe, iandike hapo juu. La sivyo, wasiliana na msaada wa UJASI.", "error", 6500);
    return;
  }
  sendPasswordReset(id);
}

function mapAuthError(code){
  const map = {
    "auth/user-not-found": "Akaunti hii haipo. Jisajili kwanza.",
    "auth/wrong-password": "Nenosiri si sahihi.",
    "auth/invalid-email": "Namba/Barua pepe si sahihi.",
    "auth/too-many-requests": "Majaribio mengi. Jaribu tena baadaye."
  };
  return map[code] || "Imeshindikana kuingia. Jaribu tena.";
}
</script>
</body>
</html>
