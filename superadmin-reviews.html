<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reviews — Super Admin | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
  .rev-card{ margin:0 18px 14px; }
  .rev-stars{ color:var(--accent); letter-spacing:2px; font-size:14px; }
  .filter-scroll{ display:flex; gap:8px; overflow-x:auto; padding:14px 18px; scrollbar-width:none; }
  .filter-scroll::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><div class="cross"></div> Reviews &amp; Ratings</div>
  </div>

  <div class="filter-scroll reveal" id="filterScroll"></div>

  <div id="revList" class="stagger"></div>
</div>

<div class="bottom-nav">
  <a href="superadmin-dashboard.html"><span class="ic">📊</span>Dashibodi</a>
  <a href="superadmin-approvals.html"><span class="ic">✅</span>Idhini</a>
  <a href="superadmin-promotions.html"><span class="ic">🎁</span>Ofa</a>
  <a href="superadmin-reviews.html" class="active"><span class="ic">⭐</span>Reviews</a>
  <a href="superadmin-settings.html"><span class="ic">⚙️</span>Mipangilio</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>guardRole("super_admin", "superadmin-login.html");</script>
<script src="js/restaurants-firestore.js"></script>
<script src="js/platform-firestore.js"></script>
<script src="js/admin-layer1.js"></script>
<script src="js/super-admin.js"></script>
<script>
let activeFilter = "zote";

function restaurantOptions(){
  const rests = getAllRestaurantProfiles();
  return [{ id: "zote", name: "Migahawa Yote" }, ...rests.map(r => ({ id: r.id, name: r.name }))];
}
function renderFilters(){
  document.getElementById("filterScroll").innerHTML = restaurantOptions().map(r =>
    `<div class="cat-chip ${r.id===activeFilter?'active':''}" onclick="selectFilter('${r.id}')">${r.name}</div>`
  ).join("");
}
function selectFilter(id){ activeFilter = id; renderFilters(); render(); }

function stars(n){
  return "★".repeat(n) + "☆".repeat(5 - n);
}

function render(){
  let list = getAllReviews();
  if(activeFilter !== "zote") list = list.filter(r => r.restaurantId === activeFilter);
  list = list.slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  const wrap = document.getElementById("revList");
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="ic">⭐</div>Bado hakuna review</div>`;
    return;
  }
  wrap.innerHTML = list.map(r => `
    <div class="card rev-card">
      <div class="row between">
        <div>
          <div style="font-weight:700; font-size:13.5px;">${r.customerName || "Mteja"}</div>
          <div class="muted" style="font-size:11.5px;">${r.restaurantName} · ${new Date(r.createdAt).toLocaleDateString("sw-TZ")}</div>
        </div>
        <div class="rev-stars">${stars(r.rating)}</div>
      </div>
      ${r.comment ? `<p style="font-size:13px; margin-top:8px;">${r.comment}</p>` : ""}
      <button class="btn btn-outline btn-sm" style="margin-top:8px; color:var(--alert); border-color:var(--alert);" onclick="removeReview('${r.id}')">Futa Review</button>
    </div>
  `).join("");
}
async function removeReview(id){
  if(!confirm("Futa review hii? (Itaondolewa milele)")) return;
  try{
    await deleteReview(id);
    showToast("Review imefutwa", "success");
    render();
  }catch(err){ console.error(err); showToast("Imeshindikana kufuta - jaribu tena", "error"); }
}

renderFilters();
render();
window.onUjasiReviewsUpdate = render; // sasisho la LIVE (Firestore onSnapshot)
</script>
</body>
</html>
