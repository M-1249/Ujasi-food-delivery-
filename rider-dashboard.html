<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashibodi — Rider | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin: 4px 18px 6px; }
  .stat-box{ background:#fff; border:1px solid var(--line); border-radius: var(--r-lg); padding:16px; box-shadow: var(--shadow-1); }
  .stat-box .sicon{ font-size:20px; margin-bottom:8px; }
  .stat-box b{ display:block; font-family: var(--font-display); font-size:22px; color: var(--primary-dark); }
  .stat-box span{ font-size:11.5px; color: var(--ink-soft); }
  .open-toggle{ display:flex; align-items:center; justify-content:space-between; }
  .switch{ position:relative; width:48px; height:27px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; cursor:pointer; inset:0; background: var(--line); border-radius: var(--r-pill); transition:.2s; }
  .slider::before{ content:""; position:absolute; width:21px; height:21px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow: var(--shadow-1); }
  input:checked + .slider{ background: var(--success); }
  input:checked + .slider::before{ transform: translateX(21px); }
  .delivery-mini{ padding:12px 14px; border-bottom:1px solid var(--line); }
  .delivery-mini:last-child{ border-bottom:none; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><div class="cross"></div> UJASI <span class="badge badge-primary" style="margin-left:4px;">Rider</span></div>
  </div>

  <div class="container reveal" style="padding-bottom:6px;">
    <div class="card" id="pendingBanner" style="display:none; margin-bottom:12px; border-color:var(--warn);">
      <div class="row gap-12">
        <div style="font-size:20px;">⏳</div>
        <div>
          <div style="font-weight:700; font-size:13.5px;">Akaunti Inasubiri Idhini</div>
          <div class="muted">Msimamizi bado hajakuthibitisha. Huwezi kwenda mtandaoni mpaka uidhinishwe.</div>
        </div>
      </div>
    </div>
    <div class="card open-toggle">
      <div>
        <div style="font-weight:700; font-size:14px;" id="riderNameLabel">Rider</div>
        <div class="muted" id="onlineStatusLabel">Uko Mtandaoni</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="onlineToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="stat-grid stagger">
    <div class="stat-box"><div class="sicon">📦</div><b id="statDelivered">0</b><span>Zimefikishwa Leo</span></div>
    <div class="stat-box"><div class="sicon">💰</div><b id="statEarnings">TSh 0</b><span>Mapato ya Leo</span></div>
    <div class="stat-box"><div class="sicon">🏍️</div><b id="statActive">0</b><span>Njiani Sasa</span></div>
    <div class="stat-box"><div class="sicon">📋</div><b id="statAvailable">0</b><span>Zinapatikana</span></div>
  </div>

  <div class="section-title container" style="padding-bottom:0;">
    <h2>Oda Njiani Sasa</h2>
    <a href="rider-deliveries.html">Zote →</a>
  </div>
  <div class="card" style="margin:0 18px 20px;" id="activeCard"></div>

</div>

<div class="bottom-nav">
  <a href="rider-dashboard.html" class="active"><span class="ic">📊</span>Dashibodi</a>
  <a href="rider-deliveries.html"><span class="ic">📦</span>Oda</a>
  <a href="rider-profile.html"><span class="ic">🏍️</span>Profaili</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>guardRole("rider", "rider-login.html");</script>
<script src="js/riders-firestore.js"></script>
<script src="js/orders-firestore.js"></script>
<script src="js/rider.js"></script>
<script>
function renderDashboard(){
  const profile = getRiderProfile();
  document.getElementById("riderNameLabel").textContent = profile.name;
  document.getElementById("onlineToggle").checked = profile.online;
  document.getElementById("onlineStatusLabel").textContent = profile.online ? "Uko Mtandaoni — Unapokea Oda" : "Umezima — Hupokei Oda";
  if(!profile.approved){
    document.getElementById("pendingBanner").style.display = "block";
    document.getElementById("onlineToggle").disabled = true;
  }

  const stats = getRiderStats();
  document.getElementById("statDelivered").textContent = stats.deliveredToday;
  document.getElementById("statEarnings").textContent = formatTZS(stats.earningsToday);
  document.getElementById("statActive").textContent = stats.activeCount;
  document.getElementById("statAvailable").textContent = stats.availableCount;

  const active = getMyActiveDeliveries();
  const card = document.getElementById("activeCard");
  if(active.length === 0){
    card.innerHTML = `<div class="empty" style="padding:24px;"><div class="ic">🏍️</div>Huna oda njiani kwa sasa</div>`;
  } else {
    card.innerHTML = active.map(o => `
      <a href="rider-deliveries.html?code=${o.orderCode}" style="text-decoration:none; color:inherit;">
        <div class="delivery-mini">
          <div class="row between">
            <span style="font-weight:700; font-family:var(--font-mono); font-size:13px;">${o.orderCode}</span>
            <span class="badge badge-primary">Njiani</span>
          </div>
          <div class="muted" style="margin-top:4px;">📍 ${o.deliveryAddress ? o.deliveryAddress.details : "Anwani haipo"}</div>
        </div>
      </a>
    `).join("");
  }
}

document.getElementById("onlineToggle").addEventListener("change", async function(e){
  const profile = getRiderProfile();
  if(!profile.approved){
    e.target.checked = false;
    showToast("Bado hujaidhinishwa na Msimamizi (Super Admin)", "error");
    return;
  }
  e.target.disabled = true;
  try{
    const online = await toggleRiderOnline();
    e.target.checked = online; // hakikisha UI inaendana na hali halisi iliyohifadhiwa
    document.getElementById("onlineStatusLabel").textContent = online ? "Uko Mtandaoni — Unapokea Oda" : "Umezima — Hupokei Oda";
    showToast(online ? "Uko mtandaoni sasa" : "Umezima kupokea oda", "success");
  }catch(err){
    console.error(err);
    e.target.checked = profile.online; // rudisha hali ya awali - imeshindikana kusasisha
    showToast("Imeshindikana kusasisha hali - jaribu tena", "error");
  }finally{
    e.target.disabled = false;
  }
});

window.onUjasiOrdersUpdate = renderDashboard; // sasisho la LIVE (Firestore onSnapshot)
window.onUjasiRidersUpdate = renderDashboard; // profaili yako (idhini/online) ikibadilika
renderDashboard();
</script>
</body>
</html>
