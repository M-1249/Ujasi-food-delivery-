<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jisajili — UJASI Food Delivery</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <div class="brand"><div class="cross"></div> UJASI</div>
  </div>

  <div class="container reveal">
    <h1 style="font-size:24px; margin-top:8px;">Fungua akaunti</h1>
    <p class="muted" style="margin-bottom:22px;">Inachukua chini ya dakika moja.</p>

    <form id="regForm">
      <div class="field">
        <label>Jina Kamili</label>
        <input type="text" id="regName" placeholder="Jina Lako" required>
      </div>
      <div class="field">
        <label>Namba ya Simu</label>
        <input type="tel" id="regPhone" placeholder="0712 345 678" required>
      </div>
      <div class="field">
        <label>Barua Pepe (hiari)</label>
        <input type="email" id="regEmail" placeholder="jina@mfano.com">
      </div>
      <div class="field">
        <label>Nenosiri</label>
        <input type="password" id="regPass" placeholder="Angalau herufi 6" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="regBtn">Jisajili</button>
    </form>

    <div class="hr"></div>
    <p style="text-align:center;" class="muted">
      Una akaunti tayari? <a href="customer-login.html" style="font-weight:700;">Ingia</a>
    </p>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById("regForm").addEventListener("submit", function(e){
  e.preventDefault();
  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim().replace(/\s+/g,"");
  const emailInput = document.getElementById("regEmail").value.trim();
  const pass = document.getElementById("regPass").value;
  const btn = document.getElementById("regBtn");

  if(!name || !phone || !pass){
    showToast("Tafadhali jaza sehemu zote za lazima", "error");
    return;
  }

  const email = emailInput || `${phone}@ujasi.app`;
  btn.disabled = true;
  btn.textContent = "Inasajili...";

  firebase.auth().createUserWithEmailAndPassword(email, pass)
    .then((cred) => {
      return db.collection("users").doc(cred.user.uid).set({
        name: name,
        phone: phone,
        email: emailInput || null,
        role: "customer",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    })
    .then(() => {
      showToast("Umesajiliwa — Karibu UJASI!", "success");
      setTimeout(() => window.location.href = "customer-home.html", 700);
    })
    .catch((err) => {
      console.error(err);
      btn.disabled = false;
      btn.textContent = "Jisajili";
      showToast(mapRegError(err.code), "error");
    });
});

function mapRegError(code){
  const map = {
    "auth/email-already-in-use": "Namba/Barua pepe hii tayari inatumika.",
    "auth/weak-password": "Nenosiri ni dhaifu, weka angalau herufi 6.",
    "auth/invalid-email": "Barua pepe/namba si sahihi."
  };
  return map[code] || "Imeshindikana kusajili. Jaribu tena.";
}
</script>
</body>
</html>
