<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Layer 1 — Dashibodi | UJASI</title>
<meta name="theme-color" content="#0C6B58">
<script>
  if(!localStorage.getItem("ujasi_admin1_session")){
    window.location.replace("adminlayer1-login.html");
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin: 4px 18px 6px; }
  .stat-box{ background:#fff; border:1px solid var(--line); border-radius: var(--r-lg); padding:16px; box-shadow: var(--shadow-1); }
  .stat-box .sicon{ font-size:20px; margin-bottom:8px; }
  .stat-box b{ display:block; font-family: var(--font-display); font-size:22px; color: var(--primary-dark); }
  .stat-box span{ font-size:11.5px; color: var(--ink-soft); }
  .alert-box{ margin:14px 18px; }
  .quick-links{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin: 6px 18px 20px; }
  .quick-link{ background:#fff; border:1px solid var(--line); border-radius: var(--r-lg); padding:16px; text-align:center; text-decoration:none; color:var(--ink); }
  .quick-link .qicon{ font-size:22px; margin-bottom:6px; }
  .quick-link .qlabel{ font-size:12.5px; font-weight:700; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><div class="cross"></div> UJASI <span class="badge badge-primary" style="margin-left:4px;">Admin L1</span></div>
  </div>

  <div class="stat-grid stagger reveal">
    <div class="stat-box"><div class="sicon">🧾</div><b id="statOrders">0</b><span>Oda za Leo (Jukwaa Lote)</span></div>
    <div class="stat-box"><div class="sicon">💰</div><b id="statRevenue">TSh 0</b><span>Mauzo ya Leo</span></div>
    <div class="stat-box"><div class="sicon">🏍️</div><b id="statRiders">0/0</b><span>Riders Mtandaoni</span></div>
    <div class="stat-box"><div class="sicon">🏪</div><b id="statRestaurants">0/0</b><span>Migahawa Wazi</span></div>
  </div>

  <div class="card alert-box" id="alertBox" style="display:none;"></div>

  <div class="section-title container" style="padding-bottom:0;">
    <h2>Vitendo vya Haraka</h2>
  </div>
  <div class="quick-links">
    <a href="adminlayer1-orders.html" class="quick-link"><div class="qicon">🧾</div><div class="qlabel">Oda Zote (Dispatch)</div></a>
    <a href="adminlayer1-restaurants.html" class="quick-link"><div class="qicon">🏪</div><div class="qlabel">Migahawa</div></a>
    <a href="adminlayer1-riders.html" class="quick-link"><div class="qicon">🏍️</div><div class="qlabel">Riders</div></a>
    <a href="adminlayer1-settings.html" class="quick-link"><div class="qicon">💳</div><div class="qlabel">Mipangilio ya Lipa Namba</div></a>
  </div>

</div>

<div class="bottom-nav">
  <a href="adminlayer1-dashboard.html" class="active"><span class="ic">📊</span>Dashibodi</a>
  <a href="adminlayer1-orders.html"><span class="ic">🧾</span>Dispatch</a>
  <a href="adminlayer1-restaurants.html"><span class="ic">🏪</span>Migahawa</a>
  <a href="adminlayer1-riders.html"><span class="ic">🏍️</span>Riders</a>
  <a href="adminlayer1-settings.html"><span class="ic">⚙️</span>Mipangilio</a>
</div>

<script src="js/app.js"></script>
<script src="js/admin-layer1.js"></script>
<script>
function renderDashboard(){
  const s = getPlatformStats();
  document.getElementById("statOrders").textContent = s.ordersToday;
  document.getElementById("statRevenue").textContent = formatTZS(s.revenueToday);
  document.getElementById("statRiders").textContent = `${s.onlineRiders}/${s.totalRiders}`;
  document.getElementById("statRestaurants").textContent = `${s.openRestaurants}/${s.totalRestaurants}`;

  const alertBox = document.getElementById("alertBox");
  if(s.unassignedCount > 0 || s.pendingCount > 0){
    alertBox.style.display = "block";
    alertBox.innerHTML = `
      <div class="row gap-12">
        <div style="font-size:20px;">⚠️</div>
        <div>
          <div style="font-weight:700; font-size:13.5px;">Yanahitaji Uangalizi</div>
          <div class="muted">
            ${s.pendingCount > 0 ? `${s.pendingCount} oda zinasubiri uthibitisho wa malipo. ` : ""}
            ${s.unassignedCount > 0 ? `${s.unassignedCount} oda tayari kuchukuliwa hazina rider bado.` : ""}
          </div>
          <a href="adminlayer1-orders.html" style="font-size:12px; font-weight:700;">Nenda kwenye Dispatch →</a>
        </div>
      </div>`;
  }
}
renderDashboard();
</script>
</body>
</html>
