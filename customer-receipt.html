<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Risiti — UJASI</title>
<meta name="theme-color" content="#0C6B58">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
  .receipt-sheet{
    margin: 18px; background:#fff; border-radius: var(--r-lg); border:1px solid var(--line);
    box-shadow: var(--shadow-2); overflow:hidden;
  }
  .receipt-head{ background: var(--primary); color:#fff; padding:20px 18px; text-align:center; }
  .receipt-head .cross{ width:26px; height:26px; margin:0 auto 8px; position:relative; }
  .receipt-head .cross::before,.receipt-head .cross::after{ content:""; position:absolute; background:#fff; border-radius:3px; }
  .receipt-head .cross::before{ width:26px; height:7px; top:9.5px; left:0; }
  .receipt-head .cross::after{ width:7px; height:26px; top:0; left:9.5px; }
  .receipt-head h3{ color:#fff; font-size:16px; margin:0; }
  .receipt-head .rno{ font-family: var(--font-mono); font-size:11.5px; opacity:.85; margin-top:4px; }

  .perforate{ position:relative; height:0; }
  .perforate::before{
    content:""; position:absolute; top:-1px; left:0; right:0; height:2px;
    background-image: radial-gradient(circle, var(--line) 2px, transparent 2px);
    background-size: 12px 4px; background-repeat: repeat-x;
  }

  .r-body{ padding:18px; }
  .r-line{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .r-line:last-child{ border-bottom:none; }
  .r-line b{ font-weight:700; }
  .r-total{ display:flex; justify-content:space-between; padding-top:14px; margin-top:8px; border-top:2px solid var(--ink); font-family: var(--font-mono); font-weight:700; font-size:16px; }

  .r-foot{ padding: 14px 18px 20px; text-align:center; }
  .r-foot .barcode{ font-family: var(--font-mono); letter-spacing:2px; font-size:22px; color: var(--ink); margin-bottom:6px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <h2 style="font-size:16px; margin:0;">Risiti Yako</h2>
  </div>

  <div class="receipt-sheet reveal" id="receiptSheet">
    <div class="receipt-head">
      <div class="cross"></div>
      <h3>UJASI FOOD DELIVERY</h3>
      <div class="rno" id="receiptNo"></div>
    </div>
    <div class="perforate"></div>
    <div class="r-body">
      <div id="itemLines"></div>
      <div class="r-line"><span>Jumla ndogo</span><span id="rSubtotal"></span></div>
      <div class="r-line"><span>Ada ya Usafirishaji</span><span id="rDelivery"></span></div>
      <div class="r-total"><span>JUMLA</span><span id="rTotal"></span></div>
    </div>
    <div class="perforate"></div>
    <div class="r-body" style="padding-top:14px;">
      <div class="r-line"><span>Jina la Mteja</span><b id="rCustomer"></b></div>
      <div class="r-line"><span>Namba ya Oda</span><b id="rCode"></b></div>
      <div class="r-line"><span>Mtandao wa Malipo</span><b id="rNetwork"></b></div>
      <div class="r-line"><span>Namba ya Muamala</span><b id="rTxn"></b></div>
      <div class="r-line"><span>Tarehe</span><b id="rDate"></b></div>
      <div class="r-line"><span>Hali</span><span class="badge badge-warn" id="rStatus"></span></div>
    </div>
    <div class="r-foot">
      <div class="barcode" id="rBarcode"></div>
      <div class="muted">Asante kwa kuagiza na UJASI — Chakula, kwa uaminifu.</div>
    </div>
  </div>

  <div class="container">
    <button class="btn btn-outline btn-block" onclick="window.print()">🖨️ Chapisha / Hifadhi kama PDF</button>
    <a href="customer-home.html" class="btn btn-primary btn-block" style="margin-top:10px;">Rudi Nyumbani</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/orders-firestore.js"></script>
<script>
const code = qParam("code");
const netMap = { vodacom:"M-Pesa (Vodacom)", tigo:"Mixx by Yas (Tigo)", airtel:"Airtel Money", halotel:"HaloPesa", ttcl:"T-Pesa (TTCL)" };
function statusLabel(s){
  const map = { pending_verification:"Inasubiri Uthibitisho", payment_confirmed:"Malipo Sahihi", preparing:"Inaandaliwa", ready_for_pickup:"Tayari Kuchukuliwa", on_the_way:"Njiani", delivered:"Imefika", cancelled:"Imeghairiwa" };
  return map[s] || s;
}

function render(order){
  if(!order){
    document.getElementById("receiptSheet").innerHTML = `<div class="empty"><div class="ic">🧾</div>${code ? "Inapakia risiti..." : "Risiti haijapatikana"}</div>`;
    return;
  }
  document.getElementById("receiptNo").textContent = "Risiti #" + order.orderCode; // NAMBA HII HII ndiyo inayotumika kufuatilia oda (si namba tofauti/ya nasibu)
  document.getElementById("itemLines").innerHTML = order.items.map(i =>
    `<div class="r-line"><span>${i.qty}× ${i.name}</span><span>${formatTZS(i.price * i.qty)}</span></div>`
  ).join("");
  document.getElementById("rSubtotal").textContent = formatTZS(order.subtotal);
  document.getElementById("rDelivery").textContent = formatTZS(order.deliveryFee);
  document.getElementById("rTotal").textContent = formatTZS(order.total);
  document.getElementById("rCustomer").textContent = order.customerName || "Mgeni";
  document.getElementById("rCode").textContent = order.orderCode;
  document.getElementById("rNetwork").textContent = netMap[order.network] || order.network;
  document.getElementById("rTxn").textContent = order.txnId;
  document.getElementById("rDate").textContent = new Date(order.createdAt).toLocaleString("sw-TZ");
  document.getElementById("rStatus").textContent = statusLabel(order.status);
  document.getElementById("rBarcode").textContent = "‖ |‖| || ‖ |||‖ | ‖‖ ||| ‖|";
}
render(null);
if(code){
  listenToOrder(code, render, function(){
    document.getElementById("receiptSheet").innerHTML = `<div class="empty"><div class="ic">🔒</div>Huna ruhusa ya kuona risiti hii.</div>`;
  }); // onSnapshot ya hati MOJA (orders/{code}) - haipakui oda za wengine
}
</script>
</body>
</html>
